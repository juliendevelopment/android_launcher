name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    # Alternate trigger so the version can be cut from a sandbox that cannot push
    # git tags (e.g. CI agents behind a proxy that blocks ref/tags writes).
    # Push a branch called release/v1.2.3 and this workflow uses '1.2.3' as the
    # release version, the same as if you had pushed a v1.2.3 tag.
    branches:
      - 'release/v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- Optional: decode a real signing keystore from a base64 secret. ----
      # When ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # are present, uncomment the block below and the env: lines under "Assemble release"
      # to ship a Play-ready APK. Until then we deliberately fall back to debug signing.
      #
      # - name: Decode release keystore
      #   if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      #   env:
      #     ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      #   run: |
      #     echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
      #     echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release
        # env:
        #   KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        #   KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        #   KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          # When triggered by a tag push, GITHUB_REF_NAME is the tag (e.g. v0.1.0).
          # When triggered by a release/vX.Y.Z branch push, strip the prefix.
          name="${GITHUB_REF_NAME#release/}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: rename
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release.apk"
          dst="launcher-${VERSION}.apk"
          cp "$src" "$dst"
          echo "asset=$dst" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.asset }}
          generate_release_notes: true
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
