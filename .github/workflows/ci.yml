name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: write   # so the failure-log push step can create the ci-logs/<sha> branch

jobs:
  build:
    name: Lint, test, and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real token (not the default action one with read perms only)
          # so the log-push step can write to the repo.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # TODO(spotless): re-enable once Spotless 6.25.0's ktlint adapter is reading
      # project .editorconfig the same way the standalone CLI does.
      # - name: Spotless check
      #   run: ./gradlew spotlessCheck --stacktrace --no-daemon

      - name: Compile debug Kotlin
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee build-compile.log

      - name: Surface compile failure
        if: steps.compile.outcome == 'failure'
        run: |
          {
            echo "## :x: compileDebugKotlin failed"
            echo
            echo '```'
            # Kotlin compile errors are prefixed with 'e:' (errors) and 'w:' (warnings).
            # Also keep Gradle FAILURE/Caused-by lines for context.
            grep -E "^(e:|w:|FAILURE|Caused by|\* What went wrong|\s+> )" build-compile.log | tail -120 || true
            echo
            echo '--- tail of full log ---'
            tail -80 build-compile.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace --no-daemon 2>&1 | tee build-lint.log

      - name: Surface lint failure
        if: steps.lint.outcome == 'failure'
        run: |
          {
            echo "## :x: lintDebug failed"
            echo
            echo '```'
            grep -E "^(e:|w:|FAILURE|Caused by|\* What went wrong|\s+> )" build-lint.log | tail -120 || true
            echo
            echo '--- tail of full log ---'
            tail -80 build-lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build-test.log

      - name: Surface unit-test failure
        if: steps.unit.outcome == 'failure'
        run: |
          {
            echo "## :x: testDebugUnitTest failed"
            echo
            echo '```'
            grep -E "^(e:|FAILURE|Caused by|\* What went wrong|\s+> |.*FAILED|.*PASSED)" build-test.log | tail -120 || true
            echo
            echo '--- tail of full log ---'
            tail -120 build-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-assemble.log

      - name: Surface assemble failure
        if: steps.assemble.outcome == 'failure'
        run: |
          {
            echo "## :x: assembleDebug failed"
            echo
            echo '```'
            grep -E "^(e:|w:|FAILURE|Caused by|\* What went wrong|\s+> )" build-assemble.log | tail -120 || true
            echo
            echo '--- tail of full log ---'
            tail -120 build-assemble.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-compile.log
            build-lint.log
            build-test.log
            build-assemble.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # On failure, push the gradle logs to an orphan branch named ci-logs/<sha>.
      # This lets the agent read them via the public Contents API without needing
      # repo-admin to download workflow artifacts.
      - name: Publish failure logs to ci-logs branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="ci-logs/${GITHUB_SHA}"
          DIR=$(mktemp -d)
          for f in build-compile.log build-lint.log build-test.log build-assemble.log; do
            [ -f "$f" ] && cp "$f" "$DIR/$f" || true
          done
          [ -f app/build/reports/lint-results-debug.xml ] && cp app/build/reports/lint-results-debug.xml "$DIR/lint-results-debug.xml" || true
          cd "$DIR"
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b "$BRANCH"
          {
            echo "# CI failure logs"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > README.md
          git add -A
          git commit -q -m "ci: logs for ${GITHUB_SHA} [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
