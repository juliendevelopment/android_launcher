org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
kotlin.incremental=true

# KSP2 (useKSP2=true) is incompatible with Room 2.6.1's annotation processor —
# Room's KSP2 support landed in 2.7. Sticking with KSP1 until we bump Room.
ksp.useKSP2=false
